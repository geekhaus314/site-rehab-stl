name: slag

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: npm ci || npm install
      - run: npx --yes slagtech-agent-control@latest verify
      - run: npx --yes slagtech-agent-control@latest gate
